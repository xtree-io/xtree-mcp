[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xtree-mcp"
version = "0.1.0"
description = "MCP server exposing XTREE API tools for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "XTREE", email = "business@xtree.io" }]
keywords = ["xtree", "mcp", "wechat", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=1.2,<2",
  "xtree>=0.1.0",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.urls]
Homepage = "https://www.xtree.io"
Documentation = "https://www.xtree.io/docs"
Repository = "https://github.com/xtree-io/xtree-mcp"

[project.scripts]
xtree-mcp = "xtree_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["xtree_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
